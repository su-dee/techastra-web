<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080a0b" />
    <link rel="stylesheet" href="/asset-loader.css" />
    <title>HACK_NEXUS 1.0 — Anyone Can Wear The Mask</title>
    <meta
      name="description"
      content="10 hours. Infinite possibilities. Join HACK_NEXUS 1.0 on October 8–9, 2026. Four domains, 15 challenges and ₹18,000+ in prizes."
    />
    <meta property="og:title" content="HACK_NEXUS 1.0 — Create Beyond Limits" />
    <meta
      property="og:description"
      content="October 8–9, 2026. A national-level hackathon. 10 hours. ₹18,000+ in prizes."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div
      id="boot-loader"
      class="boot-loader"
      role="status"
      aria-live="polite"
      hidden
    >
      <div class="boot-terminal">
        <div class="boot-chrome">
          <span class="boot-lights" aria-hidden="true"
            ><i></i><i></i><i></i></span
          ><span>HACK_NEXUS / BOOT_SEQUENCE</span
          ><span id="boot-state">INITIALIZING</span>
        </div>
        <div class="boot-body">
          <p class="boot-brand">HACK<span>_</span>NEXUS <span>1.0</span></p>
          <p class="boot-subtitle">CSE INNOVATION ALLIANCE / SECURE SHELL</p>
          <div id="boot-output" class="boot-output" aria-hidden="true">
            <p><span>01</span><code>$ hacknexus --initialize</code></p>
          </div>
          <p id="boot-message" class="boot-message">
            Establishing connection to the arena…
          </p>
          <a id="boot-retry" href="" hidden>Retry connection ↗</a>
        </div>
        <div class="boot-status">
          <span><i></i> LOCAL ASSETS</span><span>OCT 08—09 / 2026</span>
        </div>
      </div>
    </div>
    <div id="root" aria-busy="true"></div>
    <noscript
      >Please enable JavaScript to use the interactive hackathon website and
      registration portal.</noscript
    >
    <script src="/asset-loader.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
