# Render "Blueprint" - defines the backend API service and a managed
# Postgres database in one file, so Render can create both together from
# this repo instead of clicking through the dashboard for every setting.
#
# HOW TO USE:
#   1. Push this file to the branch you're deploying (already done if
#      you're reading this from the repo).
#   2. In the Render dashboard: New -> Blueprint -> connect this GitHub
#      repo -> Render finds this file automatically and shows a preview
#      of what it's about to create.
#   3. Click "Apply" - Render creates the web service + database, wires
#      DATABASE_URL between them automatically (see `fromDatabase` below),
#      and deploys.
#   4. Everything under `envVars` marked `sync: false` needs a real value
#      typed into the Render dashboard by you - these are secrets that
#      should never live in this repo (JWT_SECRET, UPI details, mail secret
#      credentials, etc.). Render will prompt for each one during setup.
#
# ONLY the backend (server/) is defined here. The frontend (client/) is a
# separate deploy on Vercel/Netlify (static site, not a Render web
# service) - see the deployment notes shared separately for that half.

services:
  - type: web
    name: techastra-api
    runtime: node
    plan: free
    region: oregon
    branch: feature/symposium-portal
    rootDir: server
    # Versioned migrations (prisma/migrations), not `db push`. If this database
    # was first created with `db push`, run once: npx prisma migrate resolve --applied 0_init
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production # enables HSTS, strict CORS, config checks; disables the dev click logger
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: techastra-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        sync: false # set to your deployed frontend URL once it exists, e.g. https://techastra.vercel.app
      - key: UPI_PAYEE_ID
        sync: false # optional: only used by /api/upi/qr; checkout shows the static QR in client/src/assets/upi-qr.png
      - key: UPI_PAYEE_NAME
        sync: false
      - key: MAIL_ENDPOINT_URL
        sync: false # php-mailer/send.php on the website host (PHP mail(), no SMTP)
      - key: MAIL_ENDPOINT_SECRET
        sync: false
    disk:
      # Persistent disk mounted at server/uploads - WITHOUT this, every
      # redeploy/restart wipes payment-proof screenshots and generated
      # certificate PDFs (Render's default filesystem is ephemeral).
      # This keeps the existing multer/pdf-lib code working completely
      # unchanged - no code rewrite needed for uploads to survive
      # restarts, at the cost of only being usable from a single Render
      # instance (fine at this app's scale; would need S3/R2 instead if
      # this ever needs to scale to multiple server instances).
      name: techastra-uploads
      mountPath: /opt/render/project/src/server/uploads
      sizeGB: 1

databases:
  - name: techastra-db
    plan: free
    region: oregon
    postgresMajorVersion: 16
