<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 400 600">
  <!-- Decorative gold / steel shards for the participant ID card (ParticipantIDCard.jsx).
       Static artwork only - no participant data. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dd9c"/>
      <stop offset="0.45" stop-color="#c9a24a"/>
      <stop offset="1" stop-color="#7d5f1a"/>
    </linearGradient>
    <linearGradient id="goldR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dd9c"/>
      <stop offset="0.45" stop-color="#c9a24a"/>
      <stop offset="1" stop-color="#7d5f1a"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a9095"/>
      <stop offset="0.5" stop-color="#5a6065"/>
      <stop offset="1" stop-color="#34383b"/>
    </linearGradient>
    <linearGradient id="steelR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a9095"/>
      <stop offset="0.5" stop-color="#5a6065"/>
      <stop offset="1" stop-color="#34383b"/>
    </linearGradient>
  </defs>

  <!-- faint shadow wedges behind the QR area -->
  <polygon points="0,150 64,214 64,346 0,410" fill="#000" opacity="0.18"/>
  <polygon points="400,150 336,214 336,346 400,410" fill="#000" opacity="0.18"/>

  <!-- top corners -->
  <polygon points="0,0 70,0 36,34 0,34" fill="url(#steel)" opacity="0.85"/>
  <polygon points="70,0 82,0 48,34 36,34" fill="url(#gold)"/>
  <polygon points="400,0 330,0 364,34 400,34" fill="url(#steelR)" opacity="0.85"/>
  <polygon points="330,0 318,0 352,34 364,34" fill="url(#goldR)"/>

  <!-- left side, beside the QR -->
  <polygon points="0,198 42,238 42,292 0,254" fill="url(#gold)" opacity="0.95"/>
  <polygon points="0,270 30,298 30,374 0,346" fill="url(#steel)" opacity="0.9"/>
  <line x1="6" y1="322" x2="74" y2="398" stroke="#c9a24a" stroke-width="1.4" opacity="0.75"/>
  <line x1="48" y1="224" x2="48" y2="296" stroke="#c9a24a" stroke-width="0.8" opacity="0.5"/>

  <!-- right side, beside the QR -->
  <polygon points="400,198 358,238 358,292 400,254" fill="url(#goldR)" opacity="0.95"/>
  <polygon points="400,270 370,298 370,374 400,346" fill="url(#steelR)" opacity="0.9"/>
  <line x1="394" y1="322" x2="326" y2="398" stroke="#c9a24a" stroke-width="1.4" opacity="0.75"/>
  <line x1="352" y1="224" x2="352" y2="296" stroke="#c9a24a" stroke-width="0.8" opacity="0.5"/>
</svg>
